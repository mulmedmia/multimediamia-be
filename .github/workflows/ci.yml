name: Backend CI

on:
  push:
    branches:
      - dev
      - main
      - 'IMPROVE-*'
      - 'feat/*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: multimediamia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Fast Unit Tests (Schemas, Auth & Finance)
        run: npm run test:unit

      - name: Run Database Migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/multimediamia_test

      - name: Run Full Test Suite
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/multimediamia_test
          JWT_SECRET: ci_test_secret_jwt_multimediamia_2026
          ALLOWED_ORIGINS: http://localhost:3000
